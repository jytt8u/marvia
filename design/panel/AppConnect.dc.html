<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; font-size: 15px; line-height: 1.5; }
    a { color: #6ea0ff; } a:hover { color: #9dbcff; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; width: 390px; height: 844px; background: #0f1218; color: #f2f5f9; overflow: hidden; position: relative;">
  <div style="padding: 47px 18px 10px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; min-height: 44px;">
    <span style="font-size: 12px; letter-spacing: .2em; color: #8b94a3;">БЫСТРЫЙ ИНТЕРНЕТ</span>
    <span style="margin-left: auto; font-size: 13px; color: #8b94a3;">до 27 сентября</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 0 18px;">

    <div style="margin-top: 54px; width: 188px; height: 188px; border-radius: 50%; background: rgba(78, 194, 127, .07); display: flex; align-items: center; justify-content: center;">
      <div style="width: 152px; height: 152px; border-radius: 50%; background: rgba(78, 194, 127, .1); display: flex; align-items: center; justify-content: center;">
        <div style="width: 116px; height: 116px; border-radius: 50%; background: #4ec27f; display: flex; align-items: center; justify-content: center;">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#0f1218" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2v9.2"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>
        </div>
      </div>
    </div>

    <div style="margin-top: 26px; font-size: 28px; font-weight: 700; letter-spacing: -.02em; color: #4ec27f;">Подключено</div>

    <!-- Страна, а не имя сервера: покупателю «ae-1» не говорит ничего. -->
    <div style="margin-top: 6px; display: flex; align-items: center; gap: 9px;">
      <span style="font-size: 16px;">ОАЭ · Дубай</span>
      <span style="padding: 2px 9px; border-radius: 999px; font-size: 12.5px; background: rgba(78, 194, 127, .12); color: #4ec27f;">42 мс</span>
    </div>
    <div style="margin-top: 3px; font-size: 13px; color: #8b94a3;">выбрано автоматически, самое быстрое</div>

    <!--
      Срок и остаток — прямо здесь. Это первое, что спрашивают у продавца, и
      каждый такой вопрос стоит ему времени: приложение знает ответ само.
    -->
    <div style="margin-top: auto; margin-bottom: 16px; width: 100%; background: #191d24; border: 1px solid #272d36; border-radius: 14px; padding: 15px 16px; display: flex; flex-direction: column; gap: 11px;">
      <div style="display: flex; align-items: baseline;">
        <span style="font-size: 14px; color: #8b94a3;">Осталось</span>
        <span style="margin-left: auto; font-size: 15px;">63 из 100 ГБ</span>
      </div>
      <div style="height: 7px; background: #0f1218; border-radius: 999px; overflow: hidden;"><i style="display: block; height: 100%; width: 63%; background: #2f6fed;"></i></div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 13px; color: #8b94a3;">Доступ до 27 сентября — это 30 дней</span>
        <span style="margin-left: auto; font-size: 13px; color: #6ea0ff;">Продлить</span>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: stretch; background: #191d24; border-top: 1px solid #272d36; padding: 6px 6px 34px; flex-shrink: 0;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: #f2f5f9; min-height: 52px; box-sizing: border-box;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2v9.2"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg>
      <span style="font-size: 12px; font-weight: 600;">Подключение</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: #8b94a3; min-height: 52px; box-sizing: border-box;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.2 2.4 3.3 5.3 3.3 8.5S14.2 18.1 12 20.5c-2.2-2.4-3.3-5.3-3.3-8.5S9.8 5.9 12 3.5z"/></svg>
      <span style="font-size: 12px;">Страны</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; color: #8b94a3; min-height: 52px; box-sizing: border-box;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/></svg>
      <span style="font-size: 12px;">Настройки</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
