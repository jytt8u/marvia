<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8b98b8; } a:hover { color: #c3ccdf; }
    .pick { border-radius: 13px; border: 1px solid rgba(255,255,255,.07); background: #0a0e18; padding: 14px 12px 12px; display: flex; flex-direction: column; align-items: center; gap: 11px; }
    .pick.on { border-color: rgba(33,196,138,.55); background: #08130f; box-shadow: 0 0 0 1px rgba(33,196,138,.25), 0 0 26px rgba(33,196,138,.12); }
    .pname { font-size: 12px; color: #6b7899; }
    .pick.on .pname { color: #9fe8cb; font-weight: 600; }
    .stage { height: 54px; display: grid; place-items: center; }
    .swatch { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; }
  </style>
</helmet>

<div style="width: 900px; height: 620px; background: #05070c; color: #e9eef8; display: flex; overflow: hidden;">

  <div style="width: 76px; flex: 0 0 76px; border-right: 1px solid rgba(255,255,255,.06); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 8px;">
    <svg viewBox="0 0 24 24" fill="none" style="width: 24px; height: 24px; margin-bottom: 14px;"><path d="M12 2 20 5.2V11.5C20 16.6 16.6 20.9 12 22.2 7.4 20.9 4 16.6 4 11.5V5.2Z" fill="#21c48a"></path><path d="M8.3 9.4 12 16.6 15.7 9.4" stroke="#05070c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <div style="width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: #4c5a7a;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="width: 19px; height: 19px;"><path d="M12 3v9M6.5 6.5a8 8 0 1 0 11 0"></path></svg>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: #4c5a7a;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="width: 19px; height: 19px;"><circle cx="8" cy="12" r="3.6"></circle><path d="M11.6 12H21M17.5 12v3.4M20.4 12v2.6"></path></svg>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: #4c5a7a;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="width: 19px; height: 19px;"><rect x="4.5" y="3.5" width="15" height="17" rx="2"></rect><path d="M8 8.5h8M8 12.5h8M8 16.5h5"></path></svg>
    </div>
    <div style="flex: 1;"></div>
    <div style="width: 44px; height: 44px; border-radius: 13px; background: rgba(33,196,138,.14); display: grid; place-items: center; color: #4dffbe;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" style="width: 19px; height: 19px;"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3.6v2.4M12 18v2.4M20.4 12H18M6 12H3.6M17.9 6.1l-1.7 1.7M7.8 16.2l-1.7 1.7M17.9 17.9l-1.7-1.7M7.8 7.8 6.1 6.1"></path></svg>
    </div>
  </div>

  <div style="flex: 1; padding: 30px 34px; display: flex; flex-direction: column; min-width: 0;">

    <div style="font-size: 19px; font-weight: 600; letter-spacing: -.01em;">Вид</div>
    <div style="font-size: 12.5px; color: #6b7899; margin-top: 4px;">меняется сразу, на работу туннеля не влияет</div>

    <div style="margin-top: 26px; font-size: 11px; letter-spacing: .16em; color: #5a688a;">ЧЕМ ВКЛЮЧАТЬ</div>

    <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px;">

      <div class="pick on">
        <div class="stage">
          <div style="width: 62px; height: 26px; border-radius: 13px; background: linear-gradient(90deg, #0f5c43, #17916a); display: flex; align-items: center; flex-direction: row-reverse; padding: 3px;">
            <div style="width: 20px; height: 20px; border-radius: 50%; background: #6bffcc;"></div>
          </div>
        </div>
        <div class="pname">Ползунок</div>
      </div>

      <div class="pick">
        <div class="stage">
          <div style="width: 48px; height: 26px; border-radius: 13px; background: #0d1424; border: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; padding: 3px;">
            <div style="width: 20px; height: 20px; border-radius: 50%; background: #4a5673;"></div>
          </div>
        </div>
        <div class="pname">Тумблер</div>
      </div>

      <div class="pick">
        <div class="stage">
          <svg viewBox="0 0 60 76" style="width: 34px; height: 44px;">
            <rect x="12" y="4" width="36" height="68" rx="6" fill="#0d1424" stroke="rgba(255,255,255,.1)"></rect>
            <circle cx="30" cy="17" r="3" fill="#3a4560"></circle>
            <line x1="30" y1="59" x2="30" y2="36" stroke="#8b98b8" stroke-width="5" stroke-linecap="round"></line>
            <circle cx="30" cy="34" r="6" fill="#c3ccdf"></circle>
          </svg>
        </div>
        <div class="pname">Рубильник</div>
      </div>

      <div class="pick">
        <div class="stage">
          <svg viewBox="0 0 60 60" style="width: 40px; height: 40px;">
            <circle cx="30" cy="30" r="23" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"></circle>
            <circle cx="30" cy="30" r="23" fill="none" stroke="#8b98b8" stroke-width="5" stroke-linecap="round" stroke-dasharray="145" stroke-dashoffset="45" transform="rotate(-90 30 30)"></circle>
          </svg>
        </div>
        <div class="pname">Кольцо</div>
      </div>

      <div class="pick">
        <div class="stage">
          <svg viewBox="0 0 24 24" style="width: 38px; height: 38px;">
            <path d="M12 2 20 5.2V11.5C20 16.6 16.6 20.9 12 22.2 7.4 20.9 4 16.6 4 11.5V5.2Z" fill="none" stroke="#8b98b8" stroke-width="1.4"></path>
            <path d="M8.3 9.4 12 16.6 15.7 9.4" fill="none" stroke="#8b98b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <div class="pname">Щит</div>
      </div>

      <div class="pick">
        <div class="stage">
          <svg viewBox="0 0 80 30" style="width: 52px; height: 20px;">
            <path d="M0 15 L10 15 L15 5 L20 25 L25 10 L30 18 L38 15 L50 15 L55 7 L60 23 L65 12 L70 15 L80 15" fill="none" stroke="#8b98b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <div class="pname">Пульс</div>
      </div>

    </div>

    <div style="margin-top: 30px; font-size: 11px; letter-spacing: .16em; color: #5a688a;">КАКОГО ЦВЕТА</div>

    <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px;">

      <div class="pick">
        <div class="swatch" style="background: #12151c; border: 1px solid rgba(255,255,255,.16);">
          <div style="width: 18px; height: 18px; border-radius: 50%; background: #f2f4f8;"></div>
        </div>
        <div class="pname">Сталь</div>
      </div>

      <div class="pick on">
        <div class="swatch" style="background: #0b1c16;">
          <div style="width: 18px; height: 18px; border-radius: 50%; background: #21c48a;"></div>
        </div>
        <div class="pname">Изумруд</div>
      </div>

      <div class="pick">
        <div class="swatch" style="background: #1c150a;">
          <div style="width: 18px; height: 18px; border-radius: 50%; background: #ffb347;"></div>
        </div>
        <div class="pname">Янтарь</div>
      </div>

      <div class="pick">
        <div class="swatch" style="background: #0a1a24;">
          <div style="width: 18px; height: 18px; border-radius: 50%; background: #4dc9ff;"></div>
        </div>
        <div class="pname">Лёд</div>
      </div>

      <div class="pick">
        <div class="swatch" style="background: #150c22;">
          <div style="width: 18px; height: 18px; border-radius: 50%; background: #b06cff;"></div>
        </div>
        <div class="pname">Слива</div>
      </div>

      <div class="pick">
        <div class="swatch" style="background: #131a0b;">
          <div style="width: 18px; height: 18px; border-radius: 50%; background: #a8c256;"></div>
        </div>
        <div class="pname">Олива</div>
      </div>

    </div>

    <div style="flex: 1;"></div>

    <div style="border-top: 1px solid rgba(255,255,255,.06); padding-top: 18px; display: flex; align-items: center; gap: 16px;">
      <div style="font-size: 11px; letter-spacing: .16em; color: #5a688a; flex: 0 0 auto;">ВОТ ТАК ЭТО ВЫГЛЯДИТ</div>
      <div style="flex: 1; height: 46px; border-radius: 23px; background: linear-gradient(90deg, #0f5c43, #17916a); border: 1px solid rgba(33,196,138,.45); display: flex; align-items: center; flex-direction: row-reverse; padding: 4px; box-shadow: 0 0 26px rgba(33,196,138,.2);">
        <div style="width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(160deg, #6bffcc, #16b47f);"></div>
        <div style="flex: 1; text-align: center; font-size: 12.5px; font-weight: 600; color: #c8ffe9; letter-spacing: .03em; padding-left: 12px;">← потяни, чтобы отключить</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
